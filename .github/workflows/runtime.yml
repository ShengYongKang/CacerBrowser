name: Runtime Assets

# Embedded Python and font archives are published once per runtime tag and are
# never replaced. App releases reuse them through runtime-release.txt, so the
# multi-hundred-MB archives are not rebuilt and re-uploaded on every version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Runtime release tag (for example runtime-1)'
        required: true
        default: 'runtime-1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Build runtime archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUNTIME_TAG: ${{ inputs.tag }}
        run: |
          python -m venv build/runtime-env
          if ($LASTEXITCODE -ne 0) { throw 'Runtime venv creation failed' }
          $runtimePython = './build/runtime-env/Scripts/python.exe'
          & $runtimePython -m pip install -r requirements-runtime.txt fonttools==4.60.1
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          & $runtimePython -m camoufox fetch
          if ($LASTEXITCODE -ne 0) { throw 'Browser download failed' }
          $engine = & $runtimePython -c "from camoufox.pkgman import camoufox_path; print(camoufox_path(download_if_missing=False))"
          if ($LASTEXITCODE -ne 0) { throw 'Browser runtime not found' }
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip' -OutFile build/python-embed.zip
          $base = "https://github.com/$($env:RELEASE_REPOSITORY)/releases/download/$($env:RUNTIME_TAG)"
          & $runtimePython tools/prepare_release.py --engine $engine --python-embed build/python-embed.zip --release-base $base --assets build/runtime-assets --resources build/runtime-resources
          if ($LASTEXITCODE -ne 0) { throw 'Runtime asset packaging failed' }
          Get-ChildItem build/runtime-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii build/runtime-assets/SHA256SUMS.txt
          python tools/smoke_release.py --resources build/runtime-resources --assets build/runtime-assets
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime smoke check failed' }

      - name: Publish immutable runtime release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$env:RUNTIME_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Runtime release $env:RUNTIME_TAG already exists; publish a new tag instead" }
          gh release create "$env:RUNTIME_TAG" build/runtime-assets/* --prerelease --title "Cacer runtime $env:RUNTIME_TAG" --notes 'Immutable runtime archives for Cacer. Publish a new tag instead of replacing assets.'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime release publishing failed' }
