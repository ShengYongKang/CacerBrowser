[package]
name = "shadowfox-manager"
version = "0.1.0"
description = "Cacer fingerprint-identity browser manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "shadowfox_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
